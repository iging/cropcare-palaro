<section class="stats-block" aria-label="Game statistics">
    <div class="stats">
        <article class="card stat">
            <div class="stat-head">
                <span class="stat-label">Wins</span>
                <span class="stat-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 21h8" />
                        <path d="M12 17v4" />
                        <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z" />
                        <path d="M17 5h3v2a3 3 0 0 1-3 3" />
                        <path d="M7 5H4v2a3 3 0 0 0 3 3" />
                    </svg>
                </span>
            </div>
            <div class="stat-value" id="statWins">0</div>
            <div class="stat-hint" id="statWinsHint">No wins yet</div>
        </article>

        <article class="card stat">
            <div class="stat-head">
                <span class="stat-label">Best Delta</span>
                <span class="stat-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <circle cx="12" cy="12" r="5" />
                        <circle cx="12" cy="12" r="1.5" fill="currentColor" />
                    </svg>
                </span>
            </div>
            <div class="stat-value" id="statBest">—</div>
            <div class="stat-hint" id="statBestHint">Closest to target</div>
        </article>

        <article class="card stat">
            <div class="stat-head">
                <span class="stat-label">Last Delta</span>
                <span class="stat-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12h4l3-8 4 16 3-8h4" />
                    </svg>
                </span>
            </div>
            <div class="stat-value" id="statLast">—</div>
            <div class="stat-hint" id="statLastHint">No attempts yet</div>
        </article>

        <article class="card stat">
            <div class="stat-head">
                <span class="stat-label">Attempts</span>
                <span class="stat-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-3-6.7" />
                        <path d="M21 4v5h-5" />
                    </svg>
                </span>
            </div>
            <div class="stat-value" id="statAttempts">0</div>
            <div class="stat-hint" id="statAttemptsHint">Total tries</div>
        </article>
    </div>

    <div class="stats-actions">
        <button class="btn-link" id="btnResetStats" type="button" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7" />
                <path d="M3 4v5h5" />
            </svg>
            Reset attempts
        </button>
    </div>
</section>
