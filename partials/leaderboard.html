<article class="card leaderboard" aria-labelledby="lbTitle">
    <header class="card-head">
        <div>
            <h2 class="card-title" id="lbTitle">Leaderboard</h2>
            <p class="card-sub">Closest stops to the target time. Top 5 only.</p>
        </div>
        <span class="badge subtle">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 21h8" />
                <path d="M12 17v4" />
                <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z" />
            </svg>
            <span id="lbCount">0 entries</span>
        </span>
    </header>

    <ol class="lb-list" id="lbList" aria-live="polite"></ol>

    <div class="lb-empty" id="lbEmpty" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="13" r="8" />
            <path d="M9 2h6" />
            <path d="M12 9.5v3.8l2.4 2.4" />
        </svg>
        <p>No attempts yet. Take your first stop to claim the top spot.</p>
    </div>

    <div class="lb-actions">
        <button class="btn-link" id="btnClearLeaderboard" type="button" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M6 6l1 14h10l1-14" />
            </svg>
            Clear leaderboard
        </button>
    </div>
</article>
